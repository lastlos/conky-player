-- Visualizer window: cava bars and a progress line, drawn by visualizer.lua.
local dir = os.getenv('CONKY_PLAYER_DIR') or (os.getenv('HOME') .. '/.config/conky-player')
local C = dofile(dir .. '/conky/common.lua')
local S = C.settings

conky.config = C.window {
  update_interval = 1 / S.viz_fps,
  gap_y = C.viz_gap_y(),
  minimum_height = S.viz_height + 10,
  own_window_title = 'conky-player-viz',
  lua_load = dir .. '/conky/visualizer.lua',
  lua_draw_hook_post = 'draw',
}

conky.text = '${voffset ' .. (S.viz_height - 5) .. '}'

-- Text panel: cover art, player name, title, artist and play time.
local dir = os.getenv('CONKY_PLAYER_DIR') or (os.getenv('HOME') .. '/.config/conky-player')
local C = dofile(dir .. '/conky/common.lua')
local S = C.settings

conky.config = C.window {
  update_interval = 0.5,
  gap_y = C.panel_gap_y(),
  lua_load = dir .. '/conky/panel.lua',
  lua_draw_hook_post = 'draw_cover',
}

conky.text = C.template([[
${if_match "${lua state}" == "on"}
${goto @x@}${color2}${font @font@:size=9}${lua field 1}${font}${color}
${goto @x@}${color1}${font @font@:bold:size=12}${lua_parse marquee 3 1 12 @w@}${font}${color}
${goto @x@}${lua_parse marquee 4 0 11 @w@}
${goto @x@}${color2}${font @symbol@:size=8}${lua status_icon}${font @mono@:size=9} ${lua field 5} / ${lua field 6}${font}${color}${endif}
]], {
  x = C.TEXT_X, w = S.width - C.TEXT_X,
  font = S.font, mono = S.font_mono, symbol = S.font_symbol,
})

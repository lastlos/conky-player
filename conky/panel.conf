-- Text panel: cover art, player name, title, artist and play time, all drawn
-- by panel.lua. Conky's own text only reserves the window's height.
local dir = os.getenv('CONKY_PLAYER_DIR') or (os.getenv('HOME') .. '/.config/conky-player')
local C = dofile(dir .. '/conky/common.lua')

conky.config = C.window {
  -- Redraws drive the marquee. 0.2 s scrolls smoothly; 0.1 s doubled the
  -- panel's CPU use for little visible gain.
  update_interval = 0.2,
  gap_y = C.panel_gap_y(),
  minimum_height = C.PANEL_HEIGHT - 4,
  lua_load = dir .. '/conky/panel.lua',
  lua_draw_hook_post = 'draw_panel',
}

conky.text = ' '

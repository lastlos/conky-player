-- Text panel: cover art, player name, title, artist and play time.
local dir = os.getenv('CONKY_PLAYER_DIR') or (os.getenv('HOME') .. '/.config/conky-player')
local C = dofile(dir .. '/conky/common.lua')
local S = C.settings

conky.config = C.window {
  update_interval = 0.5,
  gap_y = C.panel_gap_y(),
  lua_load = dir .. '/conky/panel.lua',
}

conky.text = C.template([[
${if_match "${execi 1 @q@ state}" == "on"}${image @cover@ -p 0,0 -s 80x80 -n}
${goto @x@}${color2}${font @font@:size=9}${execi 1 @q@ player}${font}${color}
${goto @x@}${color1}${font @font@:bold:size=12}${lua_parse pmarq 3 1 12 @w@}${font}${color}
${goto @x@}${lua_parse pmarq 4 0 11 @w@}
${goto @x@}${color2}${font @symbol@:size=8}${execi 1 @q@ icon}${font @mono@:size=9} ${execi 1 @q@ time}${font}${color}${endif}
]], {
  q = dir .. '/scripts/player.sh', cover = C.cover,
  x = C.TEXT_X, w = S.width - C.TEXT_X,
  font = S.font, mono = S.font_mono, symbol = S.font_symbol,
})

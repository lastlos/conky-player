# conky-player settings
#
# One "key = value" per line. Lines starting with # are comments; inline
# comments are not supported (colors start with #). Missing keys fall back
# to the defaults shown here. Apply changes with:
#
#   ~/.config/conky-player/conky-player.sh restart

# --- Position and size --------------------------------------------------
# alignment: top_left, top_middle, top_right,
#            bottom_left, bottom_middle, bottom_right
alignment = top_left
# Distance from the screen edges in pixels.
gap_x = 40
gap_y = 40
# Width of the whole widget in pixels (cover art is 80 px of it).
width = 380

# --- Colors (#RRGGBB) ---------------------------------------------------
# Artist and other regular text.
color_text = #E6DFD3
# Title, visualizer bars and progress line.
color_accent = #E3BE8C
# Player name and play time.
color_dim = #9A9488

# --- Fonts (fontconfig family names, see `fc-list : family`) -------------
font = Inter
font_mono = JetBrains Mono
# Used for the play/pause symbol.
font_symbol = DejaVu Sans
# First fallback for characters the main font lacks; it also decides which
# regional style Chinese, Japanese and Korean characters get.
font_cjk = Noto Sans CJK JP

# --- Visualizer ---------------------------------------------------------
# no = never start cava; only the progress line is drawn.
visualizer = yes
# Height of the bars in pixels.
viz_height = 50
viz_bars = 32
viz_fps = 60
# cava input method: pulse (also works on PipeWire), pipewire, alsa, ...
cava_input = pulse

# --- Auto-hide ----------------------------------------------------------
# Window classes (space separated, case-insensitive substrings of WM_CLASS)
# that never count as covering the visualizer, e.g. desktop/wallpaper apps.
cover_ignore = conky nemo-desktop hidamari
